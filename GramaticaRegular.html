<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="gramatica.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gramatica.css">
    <title>Gramática Regular</title>
</head>

<body>
    <div class="btn-voltar-container">
        <button onclick="window.location.href='index.html'">Voltar</button>
    </div>
    <h1 class="title">Simulador de Gramática Regular (GLUD)</h1>
    <div class="principal-container">
        <div id="gramatica">
            <h2>Gramática</h2>
            <div class="producao">
                <input type="text" class="lhs" aria-label="Lado esquerdo da produção">
                <span>→</span>
                <input type="text" class="rhs" aria-label="Lado direito da produção">
            </div>
        </div>

        <div class="txt-container">
            <h2>Testar cadeia</h2>

            <input type="text" id="cadeia" placeholder="Digite uma cadeia">

            <button onclick="testarCadeia()">
                Verificar
            </button>

            <p id="resultado"></p>
        </div>
    </div>
</body>

</html>
