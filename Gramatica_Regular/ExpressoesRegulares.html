<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Expressões Regulares</title>
</head>

<body>
    <div class="btn-voltar-container">
        <button onclick="window.location.href='index.html'">Voltar</button>
    </div>
    <h1 class="title">Simulador de Expressões Regulares</h1>
    <div class="principal-container">
        <div class="txt-container">
            <label>Expressão</label>
            <br>
            <input type="text" id="expressao" onkeyup="testarRegex()" placeholder="Digite a Expressão">
        </div>

        <div class="txt-container">
            <label id="label1">Texto 1</label>
            <br>
            <input type="text" id="texto1" onkeyup="testarRegex()" placeholder="Digite o Texto 1">
        </div>

        <div class="txt-container">
            <label id="label2">Texto 2</label>
            <br>
            <input type="text" id="texto2" onkeyup="testarRegex()" placeholder="Digite o Texto 2">
        </div>
    </div>
</body>

</html>
